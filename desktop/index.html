<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sona Code</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111827; color: #e5e7eb; }
    main { padding: 32px; }
    h1 { margin: 0; font-size: 20px; font-weight: 500; }
    .status { display: flex; align-items: center; gap: 14px; }
    .spinner { width: 22px; height: 22px; flex: 0 0 auto; border: 3px solid #475569; border-top-color: #60a5fa; border-radius: 50%; animation: spin .8s linear infinite; }
    .error { margin: 12px 0 0; color: #cbd5e1; }
    .error[hidden] { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <div class="status">
      <span class="spinner" id="spinner" aria-hidden="true"></span>
      <h1 id="title">加载中…</h1>
    </div>
    <p id="error" class="error" hidden>请退出应用后重试；诊断信息保存在应用日志中。</p>
  </main>
  <script>
    setTimeout(() => {
      document.getElementById("spinner").remove();
      document.getElementById("title").textContent = "启动失败";
      document.getElementById("error").hidden = false;
    }, 65000);
  </script>
</body>
</html>
