<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM API 代理记录器</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111827; color: #e5e7eb; }
    main { width: min(560px, calc(100vw - 64px)); padding: 32px; border: 1px solid #374151; border-radius: 16px; background: #1f2937; }
    h1 { margin: 0 0 12px; font-size: 22px; }
    p { margin: 8px 0; line-height: 1.6; color: #cbd5e1; }
    code { color: #93c5fd; }
    .status { display: flex; align-items: center; gap: 14px; }
    .spinner { width: 22px; height: 22px; flex: 0 0 auto; border: 3px solid #475569; border-top-color: #60a5fa; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <div class="status">
      <span class="spinner" id="spinner" aria-hidden="true"></span>
      <h1 id="title">本地服务启动中…</h1>
    </div>
    <p id="message">首次启动需要解压内置运行环境，通常需要几秒钟。</p>
    <p id="hint">正在连接 <code>127.0.0.1:8117</code>。</p>
  </main>
  <script>
    setTimeout(() => {
      document.getElementById("spinner").remove();
      document.getElementById("title").textContent = "本地服务启动失败";
      document.getElementById("message").textContent = "桌面外壳未能在 60 秒内连接到代理服务。";
      document.getElementById("hint").innerHTML =
        "请退出应用后重试。诊断信息保存在应用日志目录的 <code>desktop.log</code> 中。";
    }, 65000);
  </script>
</body>
</html>
